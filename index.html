<style>
:root{
  --teal:#2b7cf3; --teal-d:#1a5fd0; --teal-l:#eaf2ff;
  --blue:#0284c7; --blue-l:#e6f4fb;
  --ink:#0f172a; --sub:#475569; --mut:#94a3b8;
  --line:#dbe7f7; --bg:#f4f8ff; --card:#ffffff;
  --red:#dc2626; --red-l:#fef2f2; --red-line:#fecaca;
  --amber:#d97706; --amber-l:#fffbeb;
  --sh:0 1px 2px rgba(15,23,42,.05), 0 4px 16px rgba(15,23,42,.07);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 30px}

/* ---------- 页头 ---------- */
.hero{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin-bottom:14px;
  background:linear-gradient(100deg,#4a86f7 0%,#7cb1ff 55%,#abceff 100%)}
.hero-bg{display:none}
.hero-in{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px}
.hero-l h1{font-size:21px;letter-spacing:.5px;color:#0a2f6b}
.hero-sub{font-size:12px;color:rgba(10,47,107,.75);margin-top:2px}
.hero-sub #saveState{color:#0a2f6b}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hero-btns{display:flex;gap:8px}
#saveState{color:var(--teal-d);font-weight:600}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid transparent;
  font-size:14px;padding:8px 16px;min-height:38px;background:#fff;transition:background .15s,color .15s}
.btn.primary{background:var(--teal);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:rgba(255,255,255,.92);border-color:var(--teal);color:var(--teal-d)}
.btn.ghost:hover{background:var(--teal-l)}
.btn.danger{background:var(--red);color:#fff}
.btn.mini{min-height:30px;padding:4px 10px;font-size:12.5px;border-radius:8px;background:#fff;border-color:var(--line);color:var(--sub)}
.btn.mini:hover{border-color:var(--teal);color:var(--teal-d)}
.btn.mini.danger{border-color:var(--red-line);color:var(--red);background:#fff}

/* ---------- 布局 ---------- */
.layout{display:grid;grid-template-columns:216px 1fr;gap:20px;align-items:start}
.sidebar{position:sticky;top:14px;background:linear-gradient(180deg,#4a86f7,#a3c8ff);border-radius:var(--r);box-shadow:var(--sh);padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  padding:11px 12px;border-radius:10px;font-size:14.5px;color:#0a2f6b;position:relative}
.nav-item:hover{background:rgba(255,255,255,.45)}
.nav-item.active{background:#fff;color:#1d4ed8;font-weight:600}
.nav-item .ico{width:18px;height:18px;flex:none}
.navbadge{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:18px;height:18px;border-radius:9px;
  background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:600}
.side-note{margin-top:12px;padding:10px 12px;border-top:1px solid rgba(255,255,255,.5);font-size:12px;color:rgba(10,47,107,.7);line-height:1.7}
.content{min-width:0;display:flex;flex-direction:column;gap:14px}

/* ---------- 卡片与通用 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.view-head h2{font-size:18px;color:var(--ink)}
.muted{color:var(--mut);font-size:12.5px}
input[type=text],input:not([type]),input[type=date],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none;
  transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{resize:vertical}
.empty{padding:22px 12px;text-align:center;color:var(--mut);font-size:13.5px;background:#fbfdfe;border:1px dashed var(--line);border-radius:10px}
.foot{font-size:12px;color:var(--mut);padding:6px 4px;line-height:1.8}

/* ---------- 提醒条 ---------- */
.nudge{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fffbeb;border:1px solid #fde68a;
  border-radius:var(--r);padding:12px 16px;font-size:13.5px;color:#92400e}
.nudge .btn{min-height:32px;padding:4px 12px;font-size:13px}
.nudge .btn.primary{background:var(--amber);color:#fff}
.storagewarn{background:var(--red-l);border:1px solid var(--red-line);border-radius:var(--r);padding:10px 16px;color:var(--red);font-size:13.5px}

/* ---------- 首页：鸡汤金句 + 完成度 ---------- */
.home-top{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.quote-card{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:150px;padding:18px 22px 16px}
.quote-mark{font-size:42px;line-height:.6;color:var(--teal);opacity:.35;font-family:Georgia,"Times New Roman",serif;height:24px}
.quote-text{font-size:17px;font-weight:600;color:var(--ink);line-height:1.8;margin-top:6px}
.quote-by{font-size:12.5px;color:var(--mut);margin-top:8px}
.quote-next{align-self:flex-start;margin-top:12px}
.prog-card{display:flex;align-items:center;gap:18px}
.ring-wrap{position:relative;width:104px;height:104px;flex:none}
.ring-wrap .ring{width:104px;height:104px}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--teal-d)}
.prog-info{flex:1;min-width:0}
.prog-sub{font-size:14.5px;font-weight:700}
.prog-today{font-size:12.5px;color:var(--sub);margin-top:2px}
.prog-doms{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pd-row{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.pd-bar{height:7px;border-radius:999px;background:#eef2f5;overflow:hidden}
.pd-bar i{display:block;height:100%;border-radius:999px;background:var(--teal)}
.pd-num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 待办看板（工作 / 运动 / 学习） ---------- */
.board{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
.board-filter{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bf-btn{border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .12s}
.bf-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.bf-hint{font-size:12px;color:var(--mut)}
.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;min-height:190px}
.sec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sec-ico{width:26px;height:26px;border-radius:8px;background:var(--teal-l);color:var(--teal-d);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sec-name{font-size:15px;font-weight:700}
.sec-count{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.sec-add{margin-left:auto}
.sec-clear{font-size:11.5px;color:var(--mut);background:none;border:none;padding:2px 4px;border-radius:6px}
.sec-clear:hover{color:var(--red);background:var(--red-l)}
/* 临时速记（灵感） */
.qc-card{margin-top:14px;padding:14px 18px 12px}
.qc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qc-title{font-weight:700;font-size:14.5px;color:var(--ink)}
.qc-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.qc-form{display:flex;gap:8px}
.qc-form .voice-wrap{flex:1}
.qc-list{list-style:none;margin:8px 0 0;padding:0}
.qc-item{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;border-top:1px dashed var(--line);font-size:13px;position:relative}
.qc-tip{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.6;padding:8px 12px;border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.28);display:none;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin-top:4px}
.qc-item:hover .qc-tip{display:block}
.qc-txt{flex:1;min-width:0;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qc-time{color:var(--mut);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.qc-empty{color:var(--mut);font-size:12.5px;padding:4px 2px}
.qc-del{flex:none;background:none;border:none;color:var(--mut);font-size:15px;line-height:1;padding:2px 5px;border-radius:6px}
.qc-del:hover{color:var(--red);background:var(--red-l)}
/* 待办：截止日期徽标 / 描述行 / 补充入口 */
.tdo-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tdo-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tdo-desc{font-size:12px;color:var(--mut);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdo-due{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;flex:none}
.tdo-due.ok{background:#eef2f5;color:var(--mut)}
.tdo-due.later{background:#eef2f5;color:var(--sub)}
.tdo-due.soon{background:var(--teal-l);color:var(--teal-d)}
.tdo-due.today{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.tdo-due.over{background:var(--red-l);color:var(--red);border:1px solid var(--red-line)}
.tdo-time{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;flex:none;background:#eef2f5;color:var(--sub)}
.tdo-plan{font-size:11px;font-weight:500;color:var(--mut);white-space:nowrap;flex:none}
.tdo-rep{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;flex:none;background:#eef6ff;color:#1d4ed8;border:1px solid #cfe2ff}
.tdo-more{flex:none;background:none;border:1px solid transparent;color:var(--mut);font-size:12px;
  padding:2px 6px;border-radius:6px;min-width:26px}
.tdo-more:hover{color:var(--teal-d);border-color:var(--teal);background:var(--teal-l)}
.add-due{flex:none !important;width:auto !important;padding:6px 8px !important;font-size:13px !important}
.add-tip{flex-basis:100%;font-size:11.5px}
.add-sched{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.add-time{flex:none !important;width:auto !important;padding:6px 8px !important;font-size:13px !important}
.add-btns{display:flex;gap:8px}
.rep-row{display:flex;gap:6px;flex-wrap:wrap}
.rep-chip{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:13px;cursor:pointer;transition:all .12s;padding:0}
.rep-chip.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.rep-chip:hover{border-color:var(--teal)}
/* 全部待办视图 */
.all-row{display:flex;align-items:center;gap:8px 10px;padding:9px 2px;border-top:1px dashed var(--line);flex-wrap:wrap}
.all-row:first-child{border-top:none}
.all-info{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.all-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.all-title{flex:1;min-width:60px;font-size:14px;word-break:break-word}
.all-row.done .all-title{color:var(--mut);text-decoration:line-through}
.all-dom{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--teal-l);color:var(--teal-d);flex:none}
.all-when{font-size:12px;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.all-desc{font-size:12px;color:var(--sub);flex-basis:100%;padding-left:2px}
.all-acts{display:flex;gap:6px;flex:none}
.all-filter{width:auto !important;padding:6px 8px !important;font-size:13px !important}
.tlist{list-style:none;display:flex;flex-direction:column}
.tdo{display:flex;align-items:center;gap:9px;padding:8px 4px;border-radius:9px}
.tdo:hover{background:#f8fafb}
.tdo+.tdo{border-top:1px solid #f1f5f9}
.tdo.done .tdo-title{color:var(--mut);text-decoration:line-through}
.tdo-chk{flex:none;display:inline-flex}
.tdo-chk input{width:18px;height:18px;accent-color:var(--teal);cursor:pointer}
.tdo-title{flex:1;min-width:0;font-size:14.5px;word-break:break-word;cursor:text}
.tdo-del{flex:none;border:none;background:none;color:var(--mut);font-size:17px;line-height:1;padding:2px 7px;border-radius:6px;opacity:0;transition:opacity .15s}
.tdo:hover .tdo-del,.tdo-del:focus{opacity:1}
.tdo-del:hover{color:var(--red);background:var(--red-l)}
.tdo-edit{flex:1;min-width:0;border:1px solid var(--teal);border-radius:8px;padding:5px 9px;font-size:14.5px}
.add-row{display:flex;gap:8px;align-items:center;margin:2px 0 8px}
.add-row .voice-wrap{flex:1;min-width:0}

/* ---------- 条目模块（随手记 / 养娃攻略 / 生活学习） ---------- */
.entries-card{padding:14px 16px}
.entries-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.entries-title{font-size:16px;font-weight:700}
.entries-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.entries-search{width:170px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;outline:none}
.entries-search:focus{border-color:var(--teal)}
.entries-body{display:flex;flex-direction:column;gap:10px}
.entry{background:#fbfdfe;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.entry-content{font-size:14.5px;line-height:1.75;word-break:break-word;white-space:pre-wrap}
.entry-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.entry-time{font-size:11.5px;color:var(--mut)}
.entry-acts{margin-left:auto;display:flex;gap:6px}
.tag-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--teal-l);color:var(--teal-d)}
.entry-editor{background:#fff;border:1px solid var(--teal);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.entry-editor textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;resize:vertical;font-size:14.5px;line-height:1.7}
.entry-editor textarea:focus{border-color:var(--teal)}
.entry-editor .tag-input{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;outline:none}
.entry-editor .tag-input:focus{border-color:var(--teal)}
.editor-btns{display:flex;gap:8px}

/* ---------- 弹窗 / Toast ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;
  z-index:60;padding:18px}
.modal-card{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(15,23,42,.3);width:100%;max-width:440px;
  max-height:86vh;display:flex;flex-direction:column}
.modal-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:700;padding:16px 20px 10px;border-bottom:1px solid var(--line)}
.modal-x{flex:none;width:30px;height:30px;border:none;background:none;color:var(--mut);font-size:22px;line-height:1;
  border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-x:hover{color:var(--red);background:var(--red-l)}
.modal-body{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px 16px}
.f-label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--sub)}
.f-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline-check{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--sub);white-space:nowrap}
.inline-check input{width:18px;height:18px;accent-color:var(--teal)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;
  max-width:86vw;text-align:center}
.toast.show{opacity:.96;transform:translateX(-50%) translateY(0)}
.imp-stats{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:2}
.imp-stats b{color:var(--teal-d)}

/* ---------- 底部导航（移动端） ---------- */
.bottom-nav{display:none}

/* ---------- 语音输入 ---------- */
.voice-wrap{position:relative}
.voice-wrap input,.voice-wrap textarea{padding-right:46px}
.voice-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.voice-wrap textarea ~ .voice-btn{top:10px;transform:none}
.voice-btn:hover{color:var(--teal-d);border-color:var(--teal)}
.voice-btn.listening{color:#fff;background:#dc2626;border-color:#dc2626;animation:voicePulse 1.2s ease-in-out infinite}
@keyframes voicePulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.voice-hint{font-size:12px;color:#dc2626;margin-top:4px}
.no-voice .voice-btn{display:none}

/* ---------- 移动端 ---------- */
@media (max-width:768px){
  body{font-size:14.5px;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .wrap{padding:10px 12px 16px}
  /* 页头在窄屏改为上下堆叠：页头高度本已由内容撑开，这里只调整排布方向，
     让 5 个按钮排成网格完整可见（早前按钮被固定高度裁掉过）。 */
  .hero-in{position:relative;z-index:1;flex-direction:column;align-items:stretch;gap:10px;
    padding:14px 14px 16px;background:none}
  .hero-l h1{font-size:18px}
  .hero-sub{display:block;font-size:11.5px}
  .hero-r{flex-direction:column;align-items:stretch;gap:0}
  .hero-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .hero-btns .btn{width:100%;min-height:42px;font-size:14px;padding:8px 10px}
  .btn{min-height:44px;font-size:15px;padding:10px 16px}
  .btn.mini{min-height:38px;font-size:13.5px;padding:7px 12px}
  .layout{grid-template-columns:1fr;gap:12px}
  .sidebar{display:none}
  .bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -4px 16px rgba(15,23,42,.06)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;font-size:11.5px;color:var(--mut);padding:9px 0 7px;min-height:56px;position:relative}
  .bottom-nav .ico{width:22px;height:22px}
  .bottom-nav button.active{color:var(--teal-d);font-weight:600}
  .home-top{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .quote-text{font-size:15.5px}
  .tdo-del{opacity:1}
  .entries-tools{width:100%;margin-left:0}
  .entries-search{flex:1;width:auto}
  .modal-foot .btn{flex:1}
}
@media (max-width:380px){
  .hero-l h1{font-size:15.5px}
  .hero-r .btn{padding:9px 10px}
}
</style>
</head>
<body>
<noscript><div style="padding:20px;text-align:center">本页面需要启用 JavaScript 才能使用。</div></noscript>
<div id="storageWarn" class="storagewarn" hidden style="margin-bottom:12px">当前浏览器无法使用本地存储（可能处于隐私模式），填写的内容将无法保存。请换用普通模式打开本文件。</div>
<div class="wrap">
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-in">
      <div class="hero-l">
        <h1>个人办公工作台</h1>
        <div class="hero-sub">待办 · 养娃攻略 · 生活学习 · 随手记 ｜ 内容自动保存在本机浏览器 · <span id="saveState"></span></div>
      </div>
      <div class="hero-r">
        <div class="hero-btns">
          <button type="button" class="btn ghost" data-refresh title="重新加载页面并拉取云端最新数据">刷新同步</button>
          <button type="button" class="btn ghost" data-export>导出备份</button>
          <button type="button" class="btn ghost" data-csv title="把待办清单导出成 CSV（可用 Excel 打开）">导出 CSV</button>
          <button type="button" class="btn ghost" data-import>导入</button>
          <button type="button" class="btn ghost" data-sync>同步设置</button>
        </div>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav id="sideNav"></nav>
      <div class="side-note">数据默认自动保存在本机浏览器；点右上角「同步设置」填入 GitHub 令牌后，可跨设备同步到你自己的 GitHub（不占资料库容量）。</div>
    </aside>
    <main class="content">
      <div class="nudge" id="nudge" hidden>
        <span id="nudgeText"></span>
        <span style="display:flex;gap:8px;margin-left:auto">
          <button type="button" class="btn primary" data-export>导出备份</button>
          <button type="button" class="btn" data-nudge-ok>知道了</button>
        </span>
      </div>

      <section class="view" id="view-today">
        <div class="view-head" style="margin-bottom:12px">
          <h2>今天待办</h2>
          <span class="muted" id="todayDate"></span>
          <div class="entries-tools">
            <button type="button" class="btn mini ghost" data-nav="all">查看全部待办 →</button>
          </div>
        </div>
        <div class="home-top">
          <div class="card quote-card">

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

/* 截止日期（YYYY-MM-DD）相关：合法性判断 / 相差天数 / 徽标文案 */
function isDateStr(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00').getTime());}
function dayGap(dateStr){   // 目标日期 - 今天（正=未来，负=已过）
  if(!isDateStr(dateStr))return 0;
  return Math.round((new Date(dateStr+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
}
function dueInfo(t){
  if(!t.due)return null;
  var g=dayGap(t.due), md=t.due.slice(5).replace('-','-');
  if(t.done)return {cls:'ok',txt:md+' 截止'};
  if(g<0)return {cls:'over',txt:'逾期 '+(-g)+' 天'};
  if(g===0)return {cls:'today',txt:'今天要完成'};
  if(g===1)return {cls:'soon',txt:'明天'};
  if(g<=7)return {cls:'soon',txt:g+' 天后'};
  return {cls:'later',txt:md+' 截止'};
}
function dueHtml(t){
  var d=dueInfo(t);if(!d)return '';
  return '<span class="tdo-due '+d.cls+'">'+d.txt+'</span>';
}
/* 时间（HH:mm）/ 星期重复 / 聚合徽标 */
function isTimeStr(s){return typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);}
function todayWeekday(){return new Date().getDay();}            // 0=周日 … 6=周六
function startOfWeek(iso){var d=new Date(iso);if(isNaN(d.getTime()))return 0;var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d.getTime();}
function repeatLabel(arr){if(!arr||!arr.length)return '';return '周'+arr.slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7);}).map(function(w){return WD_NAMES[w].slice(1);}).join('·');}
function timeHtml(t){return t.time?'<span class="tdo-time">'+esc(t.time)+'</span>':'';}
function repeatHtml(t){return (t.repeat&&t.repeat.length)?'<span class="tdo-rep" title="每周重复">'+esc(repeatLabel(t.repeat))+'</span>':'';}
/* 计划日期小字标签：胶囊里已带具体日期的（已完成 / 超过7天）不重复显示 */
function planDateLabel(t){
  if(!t.due||t.done)return '';
  if(dayGap(t.due)>7)return '';
  return '<span class="tdo-plan" title="计划日期 '+t.due+'">'+t.due.slice(5)+'</span>';
}
function todoBadges(t){return planDateLabel(t)+dueHtml(t)+timeHtml(t)+repeatHtml(t);}
/* 看板「今天 + 逾期」聚焦：未完成，且（命中重复星期 / 无期限 / 今天及之前到期） */
function isFocusTodo(t){
  if(t.done)return false;
  if(t.repeat&&t.repeat.indexOf(todayWeekday())>=0)return true;
  if(!t.due)return true;
  return dayGap(t.due)<=0;
}
/* 重复任务：跨周后自动「重置」为未完成（本周完成，下周再来） */
function maybeResetRecurring(){
  var now=Date.now(),changed=false;
  state.todos.forEach(function(t){
    if(t.repeat&&t.repeat.length&&t.done&&t.doneAt&&startOfWeek(t.doneAt)!==startOfWeek(now)){
      t.done=false;t.doneAt=null;changed=true;
    }
  });
  if(changed)save(false);
}
/* 重复星期选择 chips（新增表单与详情弹窗共用） */
function repeatChipsHtml(sel){

  }).join('')+'</div>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var WD_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
function timeLabel(iso){
  if(!iso)return '';

  if(isNaN(d.getTime()))return '';
  if(fmtDate(d)===todayStr())return '今天 '+pad(d.getHours())+':'+pad(d.getMinutes());
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function fmtClock(iso){
  if(!iso)return '';
  var d=new Date(iso);
  if(isNaN(d.getTime()))return '';
  return fmtDate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2600);}

/* ================= 鸡汤金句（刻意避开课本款/标语款，收录相对冷门但经得起查的句子） ================= */

/* ================= 语音输入（Web Speech API） ================= */
var recog=null, recogTargetId=null, recogBase='', recogFinal='';
function speechSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
function stopVoice(){
  if(recog){try{recog.stop();}catch(e){}}
  recog=null;recogTargetId=null;recogBase='';recogFinal='';
  $$('.voice-btn').forEach(function(b){b.classList.remove('listening');});
  $$('.voice-hint').forEach(function(h){h.hidden=true;});
}
function toggleVoice(targetId){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前浏览器不支持语音识别，建议用 Chrome / Edge / 手机浏览器打开');return;}
  if(recog&&recogTargetId===targetId){stopVoice();return;}
  if(recog){stopVoice();}
  var input=$('#'+targetId);
  if(!input)return;
  recogBase=input.value||'';recogFinal='';recogTargetId=targetId;
  recog=new SR();
  recog.lang='zh-CN';recog.interimResults=true;recog.continuous=false;recog.maxAlternatives=1;
  recog.onstart=function(){
    var btn=$('[data-voice="'+targetId+'"]');
    $$('.voice-btn').forEach(function(b){b.classList.remove('listening');});
    if(btn)btn.classList.add('listening');
  };
  recog.onresult=function(ev){
    var interim='';
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var r=ev.results[i];
      if(r.isFinal)recogFinal+=r[0].transcript;else interim+=r[0].transcript;
    }
    input.value=recogBase+recogFinal+interim;
  };
  recog.onerror=function(ev){
    var msg='语音识别出错';
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed')msg='麦克风权限被拒绝，请在浏览器地址栏/设置里允许麦克风';
    else if(ev.error==='no-speech')msg='没有听到声音，再试一次';
    else if(ev.error==='aborted')return;
    else if(ev.error==='network')msg='网络错误，语音识别需要联网（且页面需为 HTTPS）';
    toast(msg);
  };
  recog.onend=function(){stopVoice();};
  try{recog.start();}catch(e){toast('启动语音识别失败：'+e.message);stopVoice();}
}

function defaultState(){
  return {version:2,savedAt:Date.now(),todos:[],quick:[],kids:[],life:[],meta:{quoteIdx:0,nudgeDismissedAt:0}};

/* v1（旧版：待办带截止/优先级/顺延 + 灵感 + 项目）→ v2 迁移。
   域映射：工作→工作，生活→运动（v1 无养娃域）。灵感→随手记；项目→随手记（打「项目」标签）。 */
function migrateV1(o){
  var DOM={'work':'work','life':'sports'};
  var todos=[];
  (o.todos||[]).forEach(function(t){
    if(!t||typeof t!=='object')return;
    var title=String(t.title==null?'':t.title).trim();
    if(!title)return;
    todos.push({id:t.id==null?uid():String(t.id),title:title.slice(0,200),done:!!t.done,
      doneAt:t.doneAt||null,domain:DOM[t.domain]||'work',createdAt:t.createdAt||new Date().toISOString(),
      due:isDateStr(t.due)?t.due:null,desc:String(t.desc==null?'':t.desc).slice(0,2000),
      time:'',repeat:[]});
  });
  var quick=[];
  (o.notes||[]).forEach(function(n){
    if(!n||typeof n!=='object')return;
    var content=String(n.content==null?'':n.content).trim();
    if(!content)return;
    quick.push({id:n.id==null?uid():String(n.id),content:content.slice(0,2000),
      tags:Array.isArray(n.tags)?n.tags.map(String).slice(0,20):[],createdAt:n.createdAt||new Date().toISOString()});
  });
  (o.projects||[]).forEach(function(p){
    if(!p||typeof p!=='object')return;
    var name=String(p.name==null?'':p.name).trim();
    if(!name)return;
    var lines=['【项目】'+name];
    if(p.currentStep)lines.push('当前：'+String(p.currentStep));
    if(p.nextStep)lines.push('下一步：'+String(p.nextStep));
    if(p.blocked)lines.push('卡点：'+(p.blocker?String(p.blocker):'未填写'));
    quick.push({id:p.id==null?uid():String(p.id),content:lines.join('\n').slice(0,2000),
      tags:['项目'],createdAt:p.createdAt||new Date().toISOString()});
  });
  return {version:2,savedAt:o.savedAt||Date.now(),todos:todos,quick:quick,kids:[],life:[],
    meta:{quoteIdx:0,nudgeDismissedAt:(o.meta&&o.meta.nudgeDismissedAt)||0}};
}
function normalizeState(o){
  if(!o||typeof o!=='object')return null;
  if(o.version===1)return migrateV1(o);
  if(o.version!==2)return null;
  ['todos','quick','kids','life'].forEach(function(k){
    if(!Array.isArray(o[k]))o[k]=[];
    o[k]=o[k].filter(function(x){return x&&typeof x==='object';});
  });
  o.todos=o.todos.filter(function(t){return String(t.title==null?'':t.title).trim();});
  o.todos.forEach(function(t){
    t.id=t.id==null?uid():String(t.id);
    t.title=String(t.title).trim().slice(0,200);
    t.done=!!t.done;
    t.doneAt=t.doneAt||null;
    t.domain=DOMAIN_KEYS.indexOf(t.domain)>=0?t.domain:'work';
    t.createdAt=t.createdAt||new Date().toISOString();
    t.due=isDateStr(t.due)?t.due:null;                       // 需要完成的日期（可选，YYYY-MM-DD）
    t.time=isTimeStr(t.time)?t.time:'';                      // 具体时间（可选，HH:mm）
    t.repeat=Array.isArray(t.repeat)?t.repeat.filter(function(w){return typeof w==='number'&&w>=0&&w<=6;}).slice(0,7):[]; // 每周重复星期
    t.desc=String(t.desc==null?'':t.desc).slice(0,2000);     // 补充说明（可选）
  });
  ['quick','kids','life'].forEach(function(k){
    o[k]=o[k].filter(function(e){return String(e.content==null?'':e.content).trim();});
    o[k].forEach(function(e){
      e.id=e.id==null?uid():String(e.id);
      e.content=String(e.content).trim().slice(0,2000);
      e.tags=Array.isArray(e.tags)?e.tags.map(String).slice(0,20):[];
      e.createdAt=e.createdAt||new Date().toISOString();
    });
  });
  o.meta=o.meta||{};
  if(typeof o.meta.quoteIdx!=='number'||o.meta.quoteIdx<0)o.meta.quoteIdx=0;
  if(typeof o.meta.nudgeDismissedAt!=='number')o.meta.nudgeDismissedAt=0;
  o.savedAt=o.savedAt||0;
  return o;
}
/* 同步后端：GitHub Gist（数据存在你自己的 GitHub 账号，不占用资料库容量） */
var GIST_API='https://api.github.com/gists';
var GH_TOKEN=localStorage.getItem('wb_gh_token')||'';
var GIST_ID =localStorage.getItem('wb_gist_id')||'';
var CLOUD_OK=!!GH_TOKEN;                // 填了令牌才启用云端同步
var pushing=false, pendingPush=false, pushTimer=null, saveTimer=null;
var syncing=false, syncPendingPush=false;  // syncNow 执行中：抑制重复延时推送；期间有新改动则结束后补推
var gistDupCount=0;   // 检测到的重复同步 Gist 数量

function setSyncLabel(txt){try{var el=$('#saveState');if(el)el.textContent=txt;}catch(e){}}
function ghEnabled(){ return !!GH_TOKEN; }
function ghHeaders(){
  var h={'Content-Type':'application/json','Accept':'application/vnd.github+json'};
  if(GH_TOKEN)h['Authorization']='Bearer '+GH_TOKEN;
  return h;
}
function loadLocal(){
  try{ return normalizeState(JSON.parse(localStorage.getItem(LS_KEY))); }catch(e){ return null; }
}
var state=loadLocal()||defaultState();
var storageOK=true;
function persistLocal(flash){
  state.savedAt=Date.now();
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(state));
    storageOK=true;$('#storageWarn').hidden=true;
    if(flash!==false){var d=new Date();setSyncLabel('· 已保存 '+pad(d.getHours())+':'+pad(d.getMinutes()));}
  }catch(e){
    storageOK=false;$('#storageWarn').hidden=false;
  }
}
/* 列出令牌名下所有含 workbench.json 的 Gist（跨设备无需手动传 ID） */
function listWorkbenchGists(){
  return fetch(GIST_API+'?per_page=100',{headers:ghHeaders()}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    var list=Array.isArray(data)?data:(data&&data.items)||[];
    return list.filter(function(g){ return g.files&&g.files['workbench.json']; });
  });
}
function gistSavedAt(g){
  return fetch(GIST_API+'/'+g.id,{headers:ghHeaders()}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    var c=j&&j.files&&j.files['workbench.json']&&j.files['workbench.json'].content, st=0;
    try{ st=JSON.parse(c).savedAt||0; }catch(e){}
    return {gist:g, savedAt:st};
  }).catch(function(){ return {gist:g, savedAt:0}; });
}
/* force=true 时忽略本地缓存的 GIST_ID 重新认领，用于发现并收敛重复的 Gist */
function resolveGistId(force){
  if(GIST_ID&&!force)return Promise.resolve(GIST_ID);
  if(!ghEnabled())return Promise.resolve(null);
  /* force 时先记下缓存值：若本次查询失败，必须回退到它，
     否则会把 GIST_ID 清空，导致下次同步误新建一个重复 Gist。 */
  var cached=GIST_ID||localStorage.getItem('wb_gist_id')||'';
  if(force)GIST_ID='';
  return listWorkbenchGists().then(function(cands){
    if(!cands.length){ gistDupCount=0; GIST_ID=cached; if(cached)localStorage.setItem('wb_gist_id',cached); return GIST_ID; }
    if(cands.length===1){ gistDupCount=0; GIST_ID=cands[0].id; localStorage.setItem('wb_gist_id',GIST_ID); return GIST_ID; }
    /* 多个候选：挑内部 savedAt 最新的，收敛到同一个 Gist，避免多设备各建各的 */
    gistDupCount=cands.length;
    return Promise.all(cands.map(gistSavedAt)).then(function(arr){
      arr.sort(function(a,b){ return b.savedAt-a.savedAt; });
      GIST_ID=arr[0].gist.id; localStorage.setItem('wb_gist_id',GIST_ID); return GIST_ID;
    });
  }).catch(function(e){ console.error('[gist] resolve failed',e); GIST_ID=cached; return GIST_ID||null; });
}
function gistPush(){
  if(!ghEnabled())return Promise.resolve(false);
  if(pushing){pendingPush=true;return Promise.resolve(true);}
  pushing=true; setSyncLabel('· 同步中…');
  var payload=JSON.stringify(state);
  return resolveGistId().then(function(id){
    var url, method, body;
    if(id){
      url=GIST_API+'/'+id; method='PATCH';
      body=JSON.stringify({files:{'workbench.json':{content:payload}}});
    }else{
      url=GIST_API; method='POST';
      body=JSON.stringify({description:'个人办公工作台同步数据',public:false,files:{'workbench.json':{content:payload}}});
    }
    return fetch(url,{method:method,headers:ghHeaders(),body:body}).then(function(r){
      if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+' '+t.slice(0,140));});
      return r.json();
    }).then(function(data){
      if(!GIST_ID && data.id){ GIST_ID=data.id; localStorage.setItem('wb_gist_id',data.id); }
      localStorage.setItem('wb_last_sync',String(Date.now()));
      pushing=false;
      if(pendingPush){pendingPush=false;schedulePush();}
      else{ var d=new Date(); setSyncLabel('· 已同步 '+pad(d.getHours())+':'+pad(d.getMinutes())); }
      return true;
    }).catch(function(err){
      pushing=false; console.error('[gist] push failed',err);
      setSyncLabel('· 同步失败，已保留本地');
      if(pendingPush){pendingPush=false;schedulePush();}
      return false;
    });
  });
}
function gistPull(){
  if(!ghEnabled())return Promise.resolve(null);
  return resolveGistId().then(function(id){
    if(!id)return null;
    return fetch(GIST_API+'/'+id,{headers:ghHeaders()}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(data){
      var f=data.files&&data.files['workbench.json'];
      if(!f||!f.content)return null;
      var remote=normalizeState(JSON.parse(f.content));
      if(!remote)return null;
      return {state:remote, savedAt:remote.savedAt||0};
    }).catch(function(err){ console.error('[gist] pull failed',err); return null; });
  });
}
function schedulePush(){
  if(!ghEnabled())return;
  if(syncing){ syncPendingPush=true; clearTimeout(pushTimer); pushTimer=null; return; } // 同步中：挂起，同步结束后补推
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){ gistPush(); },600);
}
/* 合并两份数据：按 id 取并集——任一侧独有的记录都会保留，绝不因同步丢数据；
   同一 id 两边都有时，取"最后改动的那台设备"的版本（按各自 savedAt 判断） */
function mergeStates(local, remote){
  var preferLocal=(local.savedAt||0)>=(remote.savedAt||0);
  function mergeArr(key){
    var A={},B={},ids={},out=[];
    (local[key]||[]).forEach(function(x){if(x&&x.id!=null)A[x.id]=x;});
    (remote[key]||[]).forEach(function(x){if(x&&x.id!=null)B[x.id]=x;});
    for(var k in A)ids[k]=1; for(var k2 in B)ids[k2]=1;
    Object.keys(ids).forEach(function(id){
      out.push(A[id]&&B[id]?(preferLocal?A[id]:B[id]):(A[id]||B[id]));
    });
    return out;
  }
  var meta={};for(var p in remote.meta)meta[p]=remote.meta[p];for(var q in local.meta)meta[q]=local.meta[q];
  return normalizeState({
    version:2,
    todos:mergeArr('todos'),quick:mergeArr('quick'),kids:mergeArr('kids'),life:mergeArr('life'),
    meta:meta,
    savedAt:Date.now()
  });
}
/* 完整同步：对账 → 拉取 → 合并 → 推送。合并而非覆盖，本地未同步的新建内容不会丢 */
function syncNow(){
  if(!ghEnabled())return Promise.resolve();
  syncing=true;
  setSyncLabel('· 同步中…');
  var pushOk=true;
  return reconcileGist().then(function(){ return gistPull(); }).then(function(res){
    if(res&&res.state){ state=mergeStates(state,res.state); persistLocal(false); renderAll(); }
    return gistPush();
  }).then(function(ok){
    if(ok===false){ pushOk=false; setSyncLabel('· 同步失败，已保留本地'); return; }
    localStorage.setItem('wb_last_sync',String(Date.now()));
    var d=new Date(); setSyncLabel('· 已同步 '+pad(d.getHours())+':'+pad(d.getMinutes()));
  }).catch(function(e){ console.error('[sync] failed',e); pushOk=false; setSyncLabel('· 同步失败，已保留本地'); })
  .then(function(){
    syncing=false; clearTimeout(pushTimer); pushTimer=null;
    if(syncPendingPush){ syncPendingPush=false; gistPush(); }   // 同步期间用户又改了数据，补推一次
    return pushOk;
  });
}
/* 「刷新同步」按钮：先把本地改动存下来，再拉取云端最新数据合并回来。
   有令牌 → 就地合并刷新（更温和，不打断当前视图）；无令牌 → 重新加载页面
   （用于清掉手机浏览器的缓存、以及从主屏幕图标重新进入以获得完整权限的窗口）。
   两种路径都不会丢数据：合并按 id 取并集，加载路径也会先读 localStorage。 */
function doRefresh(){
  if(!ghEnabled()){
    persistLocal(false);
    toast('本机未配置同步令牌，正在重新加载…');
    setTimeout(function(){ try{location.reload();}catch(e){location.href=location.href;} },500);
    return;
  }
  setSyncLabel('· 刷新中…');
  return syncNow().then(function(ok){
    renderAll();
    toast(ok===false?'已尝试合并，但推送云端失败（数据已保留在本机，联网后会自动重试）':'已拉取云端最新数据并合并完成');
  });
}
/* 对账：忽略缓存重新认领；发现多个同步 Gist 时自动切换到数据最新的那个 */
function reconcileGist(){
  if(!ghEnabled())return Promise.resolve();  return resolveGistId(true).then(function(){
    if(gistDupCount>1)toast('检测到 '+gistDupCount+' 个同步 Gist，已切换到数据最新的一个；多余的请在「同步设置 → 整理 Gist」清理');
  });
}
/* 清理：删除除当前 GIST_ID 之外所有含 workbench.json 的 Gist */
function cleanupDuplicateGists(){
  if(!ghEnabled())return Promise.resolve(0);
  return listWorkbenchGists().then(function(cands){
    var others=cands.filter(function(g){ return g.id!==GIST_ID; });
    if(!others.length){ toast('没有发现多余的 Gist'); return 0; }
    return Promise.all(others.map(function(g){
      return fetch(GIST_API+'/'+g.id,{method:'DELETE',headers:ghHeaders()}).then(function(r){return r.ok;}).catch(function(){return false;});
    })).then(function(res){
      var ok=res.filter(Boolean).length, bad=res.length-ok;
      toast('已清理 '+ok+' 个多余的 Gist'+(bad?('，'+bad+' 个失败'):''));
      return ok;
    });
  }).catch(function(e){ toast('清理失败：'+e.message); return 0; });
}
function save(flash){ persistLocal(flash); schedulePush(); }

/* ================= 全部待办视图：完成情况一览 ================= */
var allFilter='all', allDom='all', allTime='all';
var boardFilter='focus';   // 看板默认「今天 + 逾期」聚焦（移除「清除已完成」后，改为按今天/逾期过滤）
function renderAllTodos(){
  var box=$('#allList');if(!box)return;
  var all=state.todos.slice();
  var f=allFilter;
  var list=all.filter(function(t){
    /* 类别筛选 */
    if(allDom!=='all'&&t.domain!==allDom)return false;
    /* 状态筛选 */
    if(f==='undone')return !t.done;
    if(f==='done')return !!t.done;
    if(f==='over')return !t.done&&t.due&&dayGap(t.due)<0;
    /* 时间筛选（按截止日期） */
    if(allTime!=='all'){
      if(allTime==='none')return !t.due;
      if(!t.due)return false;
      var g=dayGap(t.due);
      if(allTime==='today')return g===0;
      if(allTime==='week')return g>=0&&g<=6;
      if(allTime==='month')return g>=0&&g<=30;
    }
    return true;
  });
  var doneN=all.filter(function(t){return t.done;}).length;
  $('#allCount').textContent='共 '+all.length+' 条 · 已完成 '+doneN+' · 未完成 '+(all.length-doneN)
    +(list.length<all.length?'（筛选后 '+list.length+' 条）':'');
  if(!list.length){box.innerHTML='<div class="empty">'+(all.length?'当前筛选下没有待办':'还没有待办，回今天待办添加第一件吧')+'</div>';return;}
  list.sort(function(a,b){
    /* 未完成在前；再按截止日期升序（无期限排最后）；最后按创建时间 */
    if(a.done!==b.done)return a.done?1:-1;
    var da=a.due||'9999-99-99', db=b.due||'9999-99-99';
    if(da!==db)return da<db?-1:1;
    return a.createdAt<b.createdAt?-1:1;
  });
  box.innerHTML=list.map(function(t){
    var when=t.done?('完成于 '+(t.doneAt?fmtClock(t.doneAt):'—')):('添加于 '+fmtClock(t.createdAt));
    return '<div class="all-row'+(t.done?' done':'')+'">'
      +'<div class="all-info">'
      +'<label class="tdo-chk" style="flex:none"><input type="checkbox" data-check-todo="'+t.id+'"'+(t.done?' checked':'')+' aria-label="完成 '+esc(t.title)+'"></label>'
      +'<span class="all-title">'+esc(t.title)+'</span>'
      +'<span class="all-dom">'+domainName(t.domain)+'</span>'
      +todoBadges(t)
      +'</div>'
      +'<div class="all-side">'
      +'<span class="all-when">'+when+'</span>'
      +'<span class="all-acts">'
      +'<button type="button" class="btn mini" data-desc-todo="'+t.id+'">'+(t.desc?'详情':'…')+'</button>'
      +'<button type="button" class="btn mini danger" data-del-todo="'+t.id+'">删除</button>'
      +'</span>'
      +'</div>'

function renderQuickCapture(){

  qc.textContent=state.quick.length?('随手记共 '+state.quick.length+' 条'):'';
  var latest=state.quick.slice().sort(function(a,b){return a.createdAt<b.createdAt?1:-1;}).slice(0,3);
  list.innerHTML=latest.length?latest.map(function(e){
    var full=String(e.content);
    var firstLine=full.split('\n')[0];
    var multiline=full.indexOf('\n')>=0;

    var display=multiline?firstLine+'…':firstLine;

function saveQuickCapture(){

function renderProgress(){
  var C=2*Math.PI*52;
  var tot=state.todos.length, done=0, todayDone=0, t=todayStr();
  var byDom={};
  DOMAINS.forEach(function(d){byDom[d.key]={total:0,done:0};});
  state.todos.forEach(function(x){
    if(!byDom[x.domain])byDom[x.domain]={total:0,done:0};
    byDom[x.domain].total++;
    if(x.done){
      byDom[x.domain].done++;done++;
      if(x.doneAt&&fmtDate(new Date(x.doneAt))===t)todayDone++;
    }
  });
  var pct=tot?Math.round(done/tot*100):0;
  $('#progRing').innerHTML='<svg class="ring" viewBox="0 0 120 120">'
    +'<circle cx="60" cy="60" r="52" fill="none" stroke="#eef2f5" stroke-width="11"/>'
    +'<circle cx="60" cy="60" r="52" fill="none" stroke="#2b7cf3" stroke-width="11" stroke-linecap="round"'
    +' stroke-dasharray="'+(pct/100*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/>'
    +'</svg><div class="ring-txt">'+(tot?pct+'%':'—')+'</div>';
  $('#progSub').textContent='已完成 '+done+' / 共 '+tot+' 项';
  $('#progToday').textContent='今天完成 '+todayDone+' 项';
  $('#progDoms').innerHTML=DOMAINS.map(function(d){
    var b=byDom[d.key];
    var p=b.total?Math.round(b.done/b.total*100):0;
    return '<div class="pd-row"><span>'+d.name+'</span>'
      +'<span class="pd-bar"><i style="width:'+p+'%"></i></span>'
      +'<span class="pd-num">'+b.done+'/'+b.total+'</span></div>';
  }).join('');
}
function renderBoard(){
  var board=$('#board');
  board.innerHTML=DOMAINS.map(function(d){
    var items=state.todos.filter(function(x){return x.domain===d.key;});
    var shown = boardFilter==='focus' ? items.filter(isFocusTodo) : items;
    var hiddenCount = items.length - shown.length;
    shown.sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      var ga=a.due?dayGap(a.due):0, gb=b.due?dayGap(b.due):0;
      if(ga!==gb)return ga<gb?-1:1;
      return a.createdAt<b.createdAt?-1:1;
    });
    var undone=shown.filter(function(x){return !x.done;});
    var html='<section class="sec" data-sec="'+d.key+'">'
      +'<div class="sec-head"><span class="sec-ico">'+d.icon+'</span>'
      +'<span class="sec-name">'+d.name+'待办</span>'
      +'<span class="sec-count">'+undone.length+' / '+shown.length+(hiddenCount?' · 隐'+hiddenCount:'')+'</span>'
      +'<button type="button" class="btn mini ghost sec-add" data-add-todo="'+d.key+'">＋ 新增</button>'
      +'</div>';
    if(shown.length){
      html+='<ul class="tlist">'+shown.map(function(x){return todoItemHtml(x);}).join('')+'</ul>';
    }else{
      html+='<div class="empty">'+(hiddenCount?'今天没有该板块的待办（'+hiddenCount+' 项未来计划 / 已完成已隐藏）':'这个板块还没有待办<br>点右上角「＋ 新增」添加第一件吧')+'</div>';

function addTodo(domain,title,opt){
  title=String(title==null?'':title).trim();
  if(!title){toast('先填写要做的事情');return null;}

  if(due&&!isDateStr(due))due='';
  var time=opt.time||'';
  if(time&&!isTimeStr(time))time='';
  var repeat=Array.isArray(opt.repeat)?opt.repeat.filter(function(w){return typeof w==='number'&&w>=0&&w<=6;}).slice(0,7):[];
  var t={id:uid(),title:title.slice(0,200),done:false,doneAt:null,domain:domain,createdAt:new Date().toISOString(),
    due:due||null,time:time,repeat:repeat,desc:''};
  state.todos.push(t);
  addingDomain=null;
  addingRepeat=[];
  save(true);renderAll();
  return t;

/* ================= 速记自动总结 =================
   两条通道：
   1) 本地汇总：免配置、离线可用，按标签/时间/高频词结构化成 Markdown（不改写原文）；
   2) AI 润色：填了大模型令牌后，调用 OpenAI 兼容接口归纳主题、增强表达。 */
var LLM_BASE =localStorage.getItem('wb_llm_base') ||'https://api.deepseek.com/v1';
var LLM_KEY  =localStorage.getItem('wb_llm_key')  ||'';
var LLM_MODEL=localStorage.getItem('wb_llm_model')||'deepseek-chat';
function llmReady(){return !!LLM_KEY;}
function quickSorted(){return state.quick.slice().sort(function(a,b){return a.createdAt<b.createdAt?-1:1;});}
function topWords(text,n){
  var s=String(text||'').replace(/[0-9A-Za-z]/g,' ').replace(/[\s\u3000]/g,'');
  var cn=s.replace(/[，。、；：！？（）《》〈〉“”‘’\[\]{}<>\-—…·~!?:;"'\/\\|+=_#@$%^&*()]/g,' ').split(' ').join('');
  var cnt={},i;
  for(i=0;i+2<=cn.length;i++){var w=cn.substr(i,2);if(/^[\u4e00-\u9fa5]{2}$/.test(w))cnt[w]=(cnt[w]||0)+1;}
  var stop='的了一是在我有个和就不人都上也很到说要去你会着没有看好自己这那我们他们什么可以还是因为所以但是';
  var arr=Object.keys(cnt).map(function(k){return [k,cnt[k]];})
    .filter(function(x){return x[1]>=2&&stop.indexOf(x[0])<0;});
  arr.sort(function(a,b){return b[1]-a[1];});
  return arr.slice(0,n||8);
}
function summarizeQuickLocal(){
  var list=quickSorted();
  if(!list.length){toast('还没有速记内容，先记一笔吧');return;}
  var L=[];
  L.push('## 速记汇总（'+todayStr()+'）');
  L.push('');
  L.push('- 共 **'+list.length+'** 条，时间跨度：'+timeLabel(list[0].createdAt)+' ~ '+timeLabel(list[list.length-1].createdAt));
  var byTag={};
  list.forEach(function(e){
    var ts=(e.tags&&e.tags.length)?e.tags:['（无标签）'];
    ts.forEach(function(t){byTag[t]=(byTag[t]||0)+1;});
  });
  var tags=Object.keys(byTag).sort(function(a,b){return byTag[b]-byTag[a];});
  L.push('');
  L.push('### 按标签分布');
  tags.forEach(function(t){L.push('- '+t+'：'+byTag[t]+' 条');});
  var words=topWords(list.map(function(e){return e.content;}).join(' '),8);
  if(words.length){
    L.push('');
    L.push('### 高频词');
    L.push('- '+words.map(function(w){return w[0]+'（'+w[1]+' 次）';}).join('、'));
  }
  L.push('');
  L.push('### 全部条目（按时间）');
  list.forEach(function(e){
    var head=String(e.content).split('\n')[0];
    L.push('- '+timeLabel(e.createdAt)+'：'+head+((e.tags&&e.tags.length)?' 〔'+e.tags.join('/')+'〕':''));
  });
  showSummary(L.join('\n'),'本地汇总 · '+list.length+' 条');
}
function summarizeQuickAI(){
  var list=quickSorted();
  if(!list.length){toast('还没有速记内容，先记一笔吧');return;}
  if(!llmReady()){openLlmSettings();return;}
  var text=list.map(function(e,i){return (i+1)+'. ['+timeLabel(e.createdAt)+'] '+String(e.content).replace(/\n/g,' ');}).join('\n');
  var prompt='你是我的私人助理。下面是我随手记下的一批灵感与备忘，请帮我整理成一份中文总结：\n'
    +'1) 归纳出 3-6 个主题，每个主题下列出相关要点；\n'
    +'2) 语言流畅、表达清晰，可适度润色，但不要编造原文没有的信息；\n'
    +'3) 末尾给出 2-3 条「值得跟进的行动建议」；\n'
    +'4) 输出 Markdown，主题用 ### 。\n\n速记原文：\n'+text;
  toast('正在调用模型润色…');
  var base=String(LLM_BASE||'').replace(/\/+$/,'');
  fetch(base+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+LLM_KEY},
    body:JSON.stringify({model:LLM_MODEL,messages:[{role:'user',content:prompt}],temperature:0.5})
  }).then(function(r){

      function(){return {ok:false,status:r.status,j:{}};});
  }).then(function(res){
    var ch=res.j&&res.j.choices;
    var content=ch&&ch[0]&&ch[0].message&&ch[0].message.content;
    if(!content){throw new Error((res.j&&res.j.error&&res.j.error.message)||('HTTP '+res.status));}
    showSummary(String(content),'AI 润色结果');
  }).catch(function(e){
    var msg=String(e&&e.message||e);
    if(/401|403|Unauthorized|incorrect/i.test(msg))msg='令牌无效或没有权限（HTTP 401）：请检查 AI 设置里的 Key。';
    else if(/Failed to fetch|NetworkError|network/i.test(msg))msg='网络请求失败：可能是接口地址不支持浏览器直连（CORS），或当前无网络。';
    openModal('AI 润色失败','<div style="font-size:13.5px;line-height:1.7">'+esc(msg)+'<br><br>可在「AI 设置」里换接口地址/模型，或先用「本地汇总」。</div>',

/* ================= 令牌记忆（便携备份码 / URL 自动恢复） ================= */
/* 令牌本来就是存 localStorage 的，但换设备、清缓存、换浏览器都会丢。
   这里提供两条互补的通道：
   1) 备份码：把令牌编码成一串可复制的文本，存进备忘录/密码管理器，任何设备粘贴即恢复；
   2) URL 参数：在链接后加 #token=备份码，打开即自动填好并保存。 */
function encodeTokenBackup(tok){
  if(!tok)return "";
  try{
    var gid=GIST_ID||localStorage.getItem('wb_gist_id')||"";
    var s=JSON.stringify({t:tok,i:gid});
    return "WB1" + btoa(unescape(encodeURIComponent(s))).replace(/=+$/,"");
  }catch(e){return "";}
}
function decodeTokenBackup(code){
  if(!code)return null;
  code=String(code).trim().replace(/\s+/g,"");
  if(code.indexOf("WB1")!==0)return null;
  var b=code.slice(3);
  try{
    var s=decodeURIComponent(escape(atob(b)));
    var o=JSON.parse(s);
    if(o&&typeof o.t==="string"&&o.t)return {token:o.t,gistId:(o.i||"")};
  }catch(e){}
  return null;
}
/* 尝试从 URL hash 恢复令牌，成功则返回 true（并清掉 hash 里的敏感串） */
function tryRestoreTokenFromUrl(){
  if(!location.hash)return false;
  var m=location.hash.match(/token=([^&]+)/);
  if(!m)return false;
  var got=decodeTokenBackup(decodeURIComponent(m[1]));
  if(!got){
    /* 也允许直接贴原始令牌（ghp_ / github_pat_ 开头），方便手动拼链接 */
    var raw=decodeURIComponent(m[1]);
    if(/^(ghp_|github_pat_|gho_)/.test(raw))got={token:raw,gistId:""};
  }
  if(!got)return false;
  GH_TOKEN=got.token;CLOUD_OK=true;
  try{
    localStorage.setItem("wb_gh_token",got.token);
    if(got.gistId){GIST_ID=got.gistId;localStorage.setItem("wb_gist_id",got.gistId);}
  }catch(e){}
  /* 立刻从地址栏抹掉令牌，避免被截图、分享或被浏览器历史记录留存 */
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){location.hash="";}
  return true;
}

/* 绑定令牌记忆区的三个按钮（弹窗渲染完才存在，故单独绑定） */
function bindTokenMemoryUI(){
  var ta=$('#ghBackupCode');
  function copyText(txt,okMsg){
    if(!txt){toast('暂无可复制的内容');return;}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast(okMsg);},function(){fallbackCopy(txt,okMsg);});
    }else{fallbackCopy(txt,okMsg);}
  }
  function fallbackCopy(txt,okMsg){
    var t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.left='-9999px';
    document.body.appendChild(t);t.select();
    try{document.execCommand('copy');toast(okMsg);}catch(e){toast('复制失败，请长按文本手动复制');}
    document.body.removeChild(t);
  }
  var cb=$('#ghCopyCode');
  if(cb)cb.addEventListener('click',function(){
    var live=$('#ghTokenInput').value.trim();
    var code=live?encodeTokenBackup(live):'';
    if(code&&ta)ta.value=code;
    copyText(code,'备份码已复制，建议存进备忘录');
  });
  var cl=$('#ghCopyLink');
  if(cl)cl.addEventListener('click',function(){
    var live=$('#ghTokenInput').value.trim();
    if(!live){toast('请先填写令牌');return;}
    var code=encodeTokenBackup(live);
    var base=location.origin+location.pathname;
    copyText(base+'#token='+code,'带令牌的链接已复制，可直接发到手机打开');
  });
  var pc=$('#ghPasteCode');
  if(pc)pc.addEventListener('click',function(){
    var input=prompt('粘贴备份码（WB1 开头）或直接粘贴令牌：');
    if(input===null)return;
    var val=input.trim();
    if(!val){toast('内容为空');return;}
    var got=decodeTokenBackup(val);
    if(!got&&/^(ghp_|github_pat_|gho_)/.test(val))got={token:val,gistId:''};
    if(!got){toast('备份码无效，请检查是否完整');return;}
    var inp=$('#ghTokenInput');if(inp)inp.value=got.token;
    GH_TOKEN=got.token;CLOUD_OK=true;localStorage.setItem('wb_gh_token',got.token);
    if(got.gistId){GIST_ID=got.gistId;localStorage.setItem('wb_gist_id',got.gistId);}
    if(ta)ta.value=encodeTokenBackup(got.token);
    refreshGhStatus();
    toast('已恢复令牌，点「保存并同步」开始同步');
  });
  var rl=$('#ghReload');
  if(rl)rl.addEventListener('click',function(){location.reload();});
}

function downloadBlob(content,mime,filename){
  var blob=new Blob([content],{type:mime});

  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}

function countMerge(res){

  ['todos','quick','kids','life'].forEach(function(k){

    openModal('导入预览',
      '<div>将把备份文件与当前记录<b>合并</b>（编号相同的记录会被备份内容覆盖，不会删除现有其他记录）。</div>'
      +'<div class="imp-stats">'+statsHtml+'</div>'
      +'<span class="muted">如需完全替换现有数据，请先手动清除本浏览器数据后再导入。</span>',
      [{text:'取消',fn:closeModal},
       {text:'确认导入',cls:'primary',fn:function(){
          ['todos','quick','kids','life'].forEach(function(k){
            var ids={};state[k].forEach(function(x){ids[x.id]=1;});
            res[k].forEach(function(x){
              if(ids[x.id]){for(var i=0;i<state[k].length;i++)if(state[k][i].id===x.id){state[k][i]=x;break;}}
              else state[k].push(x);
            });
          });
          if(res.meta&&typeof res.meta.quoteIdx==='number')state.meta.quoteIdx=res.meta.quoteIdx;
          save();renderAll();closeModal();
          toast('导入完成：待办 +'+c.todos.add+'、随手记 +'+c.quick.add+'、养娃 +'+c.kids.add+'、生活学习 +'+c.life.add);
        }}]);
  };
  reader.onerror=function(){toast('读取文件失败，请重试');};
  reader.readAsText(file,'utf-8');
}

/* ================= 事件委托 ================= */
function closestAttr(e,attr){var el=e.target;while(el&&el!==document){if(el.getAttribute&&el.getAttribute(attr)!=null)return el;el=el.parentNode;}return null;}
function bindEvents(){
  document.addEventListener('click',function(e){
    var el;
    if((el=closestAttr(e,'data-nav'))){switchView(el.getAttribute('data-nav'));return;}
    if((el=closestAttr(e,'data-voice'))){toggleVoice(el.getAttribute('data-voice'));return;}
    if((el=closestAttr(e,'data-export'))){doExport();return;}
    if((el=closestAttr(e,'data-csv'))){doExportCsv();return;}
    if((el=closestAttr(e,'data-import'))){$('#importFile').click();return;}
    if((el=closestAttr(e,'data-refresh'))){doRefresh();return;}
    if((el=closestAttr(e,'data-sync'))){openSyncSettings();return;}
    if((el=closestAttr(e,'data-nudge-ok'))){state.meta.nudgeDismissedAt=totalRecords();save();renderNudge();return;}
    if((el=closestAttr(e,'data-quote-next'))){state.meta.quoteIdx=(state.meta.quoteIdx||0)+1;save(false);renderQuote();return;}
    /* 待办 */
    if((el=closestAttr(e,'data-summarize'))){
      var mode=el.getAttribute('data-summarize');
      if(mode==='ai')summarizeQuickAI();else summarizeQuickLocal();
      return;
    }
    if((el=closestAttr(e,'data-llm-settings'))){openLlmSettings();return;}
    if((el=closestAttr(e,'data-add-todo'))){openTodoAddModal(el.getAttribute('data-add-todo'));return;}
    if((el=closestAttr(e,'data-modal-close'))){if(recog)stopVoice();closeModal();return;}
    if(e.target&&e.target.id==='modalWrap'){if(recog)stopVoice();closeModal();return;}
    if((el=closestAttr(e,'data-board-filter'))){boardFilter=el.getAttribute('data-board-filter');renderBoardFilter();renderBoard();return;}
    if((el=closestAttr(e,'data-rep-chip'))){
      var rw=+el.getAttribute('data-rep-chip');
      var ix=addingRepeat.indexOf(rw);
      if(ix>=0){addingRepeat.splice(ix,1);el.classList.remove('on');}
      else{addingRepeat.push(rw);el.classList.add('on');}
      return;
    }
    if((el=closestAttr(e,'data-check-todo'))){toggleTodo(el.getAttribute('data-check-todo'));return;}
    if((el=closestAttr(e,'data-edit-todo'))){startEditTodo(el.getAttribute('data-edit-todo'));return;}
    if((el=closestAttr(e,'data-del-todo'))){delTodo(el.getAttribute('data-del-todo'));return;}
    if((el=closestAttr(e,'data-desc-todo'))){openTodoDesc(el.getAttribute('data-desc-todo'));return;}
    /* 条目模块 */
    if((el=closestAttr(e,'data-add-entry'))){var ak=el.getAttribute('data-add-entry');addingEntry=ak;editingEntry=null;renderEntries(ak);return;}
    if((el=closestAttr(e,'data-cancel-entry'))){var ck=el.getAttribute('data-cancel-entry');addingEntry=null;editingEntry=null;renderEntries(ck);return;}
    if((el=closestAttr(e,'data-save-entry'))){saveEntry(el.getAttribute('data-save-entry'));return;}
    if((el=closestAttr(e,'data-edit-entry'))){
      var parts=el.getAttribute('data-edit-entry').split('|');
      editingEntry={coll:parts[0],id:parts[1]};addingEntry=null;renderEntries(parts[0]);return;
    }
    if((el=closestAttr(e,'data-del-entry'))){
      var p2=el.getAttribute('data-del-entry').split('|');
      delEntry(p2[0],p2[1]);return;
    }
  });
  /* 新增待办表单（Enter 即可提交） */
  document.addEventListener('submit',function(e){
    e.preventDefault();
    var form=e.target;
    var dom=form&&form.getAttribute&&form.getAttribute('data-add-form');
    if(dom){
      submitTodoAddForm(dom);
      return;
    }
    if(form&&form.hasAttribute&&form.hasAttribute('data-qc-form')){saveQuickCapture();}
  });
  /* 条目搜索 */
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t&&t.getAttribute){
      var k=t.getAttribute('data-entry-search');
      if(k){entryQuery[k]=t.value;renderEntries(k);}
      if(t.id==='allDom'){allDom=t.value;renderAllTodos();}
      else if(t.id==='allFilter'){allFilter=t.value;renderAllTodos();}
      else if(t.id==='allTime'){allTime=t.value;renderAllTodos();}
    }
  });
  /* 键盘：Enter 保存待办编辑，Esc 取消编辑/新增 */
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(!t||!t.getAttribute)return;
    if(e.key==='Escape'){
      if(!$('#modalWrap').hidden){if(recog)stopVoice();closeModal();return;}
      if(t.getAttribute('data-edit-input')){editingTodoId=null;renderBoard();}
      else if(addingEntry||editingEntry){addingEntry=null;editingEntry=null;ENTRY_VIEWS.forEach(function(v){renderEntries(v.key);});}
      return;
    }
    if(e.key==='Enter'&&t.getAttribute('data-edit-input')){
      saveTodoEdit(t.getAttribute('data-edit-input'),t.value);
    }
  });
  /* 导入文件 */
  document.addEventListener('change',function(e){
    var f=e.target;
    if(f&&f.getAttribute&&f.getAttribute('id')==='importFile'&&f.files&&f.files[0])doImport(f.files[0]);
  });
  /* 页面隐藏/恢复：重新拉一次云端（跨设备改动能尽快看到） */
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){ maybeResetRecurring(); if(ghEnabled())syncNow(); }
  });
}

/* ================= 初始化 ================= */
function init(){
  /* 先尝试从 URL 里恢复令牌（#token=备份码），这样换设备打开链接即可免重输 */
  var restored=tryRestoreTokenFromUrl();
  if(!speechSupported())document.body.classList.add('no-voice');
  if(ghEnabled()){ syncNow(); }
  if(restored)setTimeout(function(){toast('已从链接恢复同步令牌');},600);
  buildNavs();
  bindEvents();
  maybeResetRecurring();
  renderBoardFilter();
  $('#footNote').innerHTML='数据说明：内容自动保存在<b>本机浏览器</b>，并在你配置 GitHub 令牌后同步到<b>你自己的 GitHub Gist</b>（多设备共用同一份，不依赖资料库容量）；未配置令牌时仅本机保存。断网时本页功能仍可用，联网后自动同步。';
  renderAll();
  if(storageOK===false)$('#storageWarn').hidden=false;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
